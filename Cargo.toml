[package]
name = "gitshow"
version = "0.1.0"
edition = "2024"
description = "精简的 Git 图形客户端"
license = "MIT"

[[bin]]
name = "GitShow"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
png = "0.18.1"
winresource = "0.1.34"

[profile.release]
strip = true
